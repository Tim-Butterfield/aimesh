<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="766px" preserveAspectRatio="none" style="width:604px;height:766px;background:#FFFFFF;" version="1.1" viewBox="0 0 604 766" width="604px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="426.6582" x="88.1553" y="33.5352">Verify environment readiness &#8212; doctor / preflight (CUC-2)</text></g><ellipse cx="333.8975" cy="62.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="193.7715" x="237.0117" y="92.4883"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="146.373" x="247.0117" y="114.0898">Detect available adapters</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="173.7715" x="247.0117" y="128.2227">(probe each detect command)</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="237.5879" x="215.1035" y="160.7539"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="217.5879" x="225.1035" y="182.3555">Resolve roles -&gt; adapters -&gt; models</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="125.6484" x="225.1035" y="196.4883">(defaults + overrides)</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="377.3867" x="145.2041" y="229.0195"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="357.3867" x="155.2041" y="250.6211">Check adapter binaries present/resolvable (per selected lane)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="199.8984" x="155.2041" y="264.7539">(auth-state check = target/future)</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="259.8008" x="203.9971" y="297.2852"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="239.8008" x="213.9971" y="318.8867">Validate model profiles (catalog resolves)</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="339.6055" x="164.0947" y="351.418"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="319.6055" x="174.0947" y="373.0195">Check surface capabilities (read/write, diff, artifact dir)</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="300.5293" x="183.6328" y="454.0283"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="270.4746" x="193.6328" y="475.6299">Safe &lt;binary&gt; --version check (no model call)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="280.5293" x="193.6328" y="489.7627">(live model-identity verification = target/future)</text><polygon fill="#F1F1F1" points="309.5959,405.5508,358.199,405.5508,370.199,417.5508,358.199,429.5508,309.5959,429.5508,297.5959,417.5508,309.5959,405.5508" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.4829" x="337.8975" y="440.1855">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="48.603" x="309.5959" y="421.708">--probe?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.5835" x="370.199" y="415.2305">no</text><polygon fill="#F1F1F1" points="333.8975,522.2939,345.8975,534.2939,333.8975,546.2939,321.8975,534.2939,333.8975,522.2939" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon fill="#F1F1F1" points="291.6431,566.2939,376.1519,566.2939,388.1519,578.2939,376.1519,590.2939,291.6431,590.2939,279.6431,578.2939,291.6431,566.2939" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="84.5088" x="291.6431" y="582.4512">all checks pass?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.4829" x="262.1602" y="575.9736">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.5835" x="388.1519" y="575.9736">no</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="341.3105" x="16" y="600.2939"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="321.3105" x="26" y="621.8955">Announce resolved role -&gt; adapter -&gt; model mapping</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="165.4238" x="103.9434" y="668.5596"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="145.4238" x="113.9434" y="690.1611">Proceed (or report ready)</text><ellipse cx="186.6553" cy="735.6924" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="186.6553" cy="735.6924" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="207.6582" x="377.3105" y="600.2939"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="149.