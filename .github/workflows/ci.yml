# CI runs the same gate contributors run locally. The Makefile defines green; this file only
# invokes it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: make gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            meshcore/go.sum

      - name: Standard gate (fmt, vet, staticcheck, build, test, race, boundary, both golden runs)
        run: make gate

      # Not part of the gate: this catches Windows compile errors; nothing runs on Windows here.
      - name: Windows cross-compile
        run: make windows-build
